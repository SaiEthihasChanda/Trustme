[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trustme-secrets"
version = "1.0.0"
description = "Read application secrets from TrustMe with a single call."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "TrustMe" }]
dependencies = [
  "cryptography>=41",
  "argon2-cffi>=21.3",
]

[project.urls]
Homepage = "https://trustme-33ab7.web.app"

[tool.setuptools.packages.find]
include = ["trustme*"]
