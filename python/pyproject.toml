[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trustme-secrets"
version = "0.3.0"
description = "Read application secrets from TrustMe with a single call."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Sai Ethihas Chanda", email = "saiethihaschanda@gmail.com" }]
keywords = ["secrets", "credentials", "security", "vault"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security :: Cryptography",
]
dependencies = [
  "cryptography>=41",
  "argon2-cffi>=21.3",
]

[project.urls]
Homepage = "https://trustme-33ab7.web.app"
Source = "https://github.com/SaiEthihasChanda/Trustme"

[tool.setuptools.packages.find]
include = ["trustme_secrets*"]
